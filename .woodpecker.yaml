when:
  - event: [push, manual]
    branch: main

labels:
  backend: local

steps:
  - name: build-test-import
    image: bash
    environment:
      XDG_DATA_HOME: /var/lib/ac-ci-builder/.local/share
      XDG_CONFIG_HOME: /var/lib/ac-ci-builder/.config
      XDG_RUNTIME_DIR: /run/user/1001
    commands:
      - /usr/local/bin/ac-ci-builder-store run nginx -- sh ops/ci-builder/build-test-import.sh

  - name: deploy
    image: bash
    commands:
      - sudo -n /usr/local/sbin/ac-nginx-deploy --deploy "$CI_COMMIT_SHA"

  - name: cleanup-builder
    image: bash
    environment:
      XDG_DATA_HOME: /var/lib/ac-ci-builder/.local/share
      XDG_CONFIG_HOME: /var/lib/ac-ci-builder/.config
      XDG_RUNTIME_DIR: /run/user/1001
    commands:
      - |
        if ! /usr/local/bin/ac-ci-builder-store cleanup --apply; then
          echo "BUILDER_CLEANUP_WARNING: deployment succeeded; cleanup needs attention" >&2
        fi
